spring:
  application:
    name: AI Voice Assistant

  datasource:
    url: jdbc:mysql://localhost:3306/voice_assistant1
    username: root
    password: tiger
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash
            temperature: 0.7

logging:
  level:
    root: INFO
    com.voiceassistant: DEBUG
    org.springframework.web: INFO
    org.springframework.ai: DEBUG

server:
  port: 8080
  servlet:
    context-path: /
